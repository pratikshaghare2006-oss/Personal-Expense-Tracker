<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Personal Expense Tracker" />
    <title>Budgets</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/user.css" />
  </head>
  <body class="user-area">
    <aside class="sidebar">
      <a class="brand" href="/user/dashboard.html" style="color: white"
        ><span class="brand-mark">₹</span> ExpenseTrack</a
      >
      <h3>User Menu</h3>
      <a class="side-link" href="/user/dashboard.html">▦ Dashboard</a
      ><a class="side-link" href="/user/add-expense.html">− Add Expense</a
      ><a class="side-link" href="/user/add-income.html">+ Add Income</a
      ><a class="side-link" href="/user/transactions.html">↔ Transactions</a
      ><a class="side-link" href="/user/categories.html">▤ Categories</a
      ><a class="side-link" href="/user/budgets.html">◷ Budgets</a
      ><a class="side-link" href="/user/reports.html">▥ Reports</a
      ><a class="side-link" href="/user/financial-summary.html">₹ Summary</a
      ><a class="side-link" href="/user/profile.html">⚙ Profile</a
      ><a
        class="side-link"
        href="#"
        onclick="
          logout();
          return false;
        "
        >↪ Logout</a
      >
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h1>Budgets</h1>
          <p class="muted">Welcome, <span data-user-name>User</span></p>
        </div>
        <span class="user-badge">User</span>
      </div>
      <div class="page-grid">
        <div class="card">
          <h3>Set Monthly Budget</h3>
          <div id="msg" hidden></div>
          <form id="budgetForm">
            <div class="form-group">
              <label>Expense Category</label
              ><select id="category" name="category_id"></select>
            </div>
            <div class="form-group">
              <label>Budget Amount (₹)</label
              ><input
                name="amount"
                type="number"
                min="0"
                step="0.01"
                required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Month</label
                ><select name="month">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
              <div class="form-group">
                <label>Year</label
                ><input name="year" type="number" value="2026" required />
              </div>
            </div>
            <button class="btn btn-primary">Save Budget</button>
          </form>
        </div>
        <div>
          <h3>Your Budgets</h3>
          <div id="budgetList" style="display: grid; gap: 10px"></div>
        </div>
      </div>
    </main>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/user.js"></script>
  </body>
</html>
