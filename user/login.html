<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Personal Expense Tracker" />
    <title>User Login | ExpenseTrack</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/user.css" />
  </head>
  <body class="user-area">
    <main class="auth-page">
      <div class="auth-box">
        <a class="brand" href="/"
          ><span class="brand-mark">₹</span> ExpenseTrack</a
        >
        <h1>User Login</h1>
        <p class="muted" style="text-align: center">Welcome back.</p>
        <div id="msg" hidden></div>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label><input name="email" type="email" required />
          </div>
          <div class="form-group">
            <label>Password</label
            ><input name="password" type="password" required />
          </div>
          <button class="btn btn-primary" style="width: 100%">Login</button>
        </form>
        <p style="text-align: center">
          New user?
          <a style="color: #2563eb; font-weight: 700" href="/user/register.html"
            >Create account</a
          >
        </p>
      </div>
    </main>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
