<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Personal Expense Tracker" />
    <title>Contact | ExpenseTrack</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body class="">
    <header class="navbar">
      <div class="container nav-inner">
        <a class="brand" href="/"
          ><span class="brand-mark">₹</span> ExpenseTrack</a
        ><button class="nav-toggle">☰</button>
        <nav class="nav-links">
          <a href="/">Home</a><a href="/features.html">Features</a
          ><a href="/about.html">About</a><a href="/contact.html">Contact</a
          ><a class="btn btn-primary" href="/user/login.html">Login</a>
        </nav>
      </div>
    </header>
    <main class="section">
      <div class="container" style="max-width: 750px">
        <div class="section-title">
          <h2>Contact us</h2>
          <p>Send a message to the ExpenseTrack team.</p>
        </div>
        <div class="card">
          <div id="msg" hidden></div>
          <form id="contactForm">
            <div class="form-row">
              <div class="form-group">
                <label>Name</label><input name="name" required />
              </div>
              <div class="form-group">
                <label>Email</label><input name="email" type="email" required />
              </div>
            </div>
            <div class="form-group">
              <label>Subject</label><input name="subject" />
            </div>
            <div class="form-group">
              <label>Message</label
              ><textarea name="message" required></textarea>
            </div>
            <button class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="container footer-grid">
        <div>
          <h3>ExpenseTrack</h3>
          <p>Simple, secure and smart personal money management.</p>
        </div>
        <div>
          <h3>Explore</h3>
          <a href="/features.html">Features</a><a href="/about.html">About</a>
        </div>
        <div>
          <h3>Account</h3>
          <a href="/user/login.html">Login</a
          ><a href="/user/register.html">Register</a>
        </div>
      </div>
    </footer>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/public.js"></script>
  </body>
</html>
